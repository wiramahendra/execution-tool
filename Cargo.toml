[package]
name = "execution-tool"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Sandboxed tool execution for agents: filesystem, shell, and HTTP behind deny-by-default policies with SSRF protection."
repository = "https://github.com/wiramahendra/execution-tool"
readme = "README.md"
keywords = ["agent", "sandbox", "ssrf", "tools", "security"]
categories = ["development-tools", "web-programming"]

[lib]
name = "execution_tool"
path = "src/lib.rs"

[features]
default = []
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:cap-std"]
backend-wasm = ["wasm"]
backend-container = ["dep:watchdog"]
container = ["backend-container"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.40", features = ["rt", "rt-multi-thread", "process", "fs", "io-util", "sync", "time", "macros", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "stream"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"
base64 = "0.22"
wasmtime = { version = "22", optional = true }
wasmtime-wasi = { version = "22", optional = true }
cap-std = { version = "3.0", optional = true }
watchdog = { git = "https://github.com/wiramahendra/watchdog", branch = "main", optional = true }
axum = { version = "0.7", features = ["json", "query"] }
tower = { version = "0.5", features = ["limit", "util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio-stream = "0.1"
serde_yaml = "0.9"
notify = "6.1"
rustix = { version = "0.38", features = ["fs", "process"] }
glob = "0.3"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "test-util"] }
arbitrary = { version = "1.3", features = ["derive"] }
wat = "1.0"

[[bin]]
name = "fuzz_destination"
path = "fuzz/fuzz_destination.rs"

[[bin]]
name = "validation-analyzer"
path = "src/bin/validation_analyzer.rs"

[package]
name = "execution-tool"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Sandboxed tool execution for agents: filesystem, shell, and HTTP behind deny-by-default policies with SSRF protection."
repository = "https://github.com/wiramahendra/execution-tool"
readme = "README.md"
keywords = ["agent", "sandbox", "ssrf", "tools", "security"]
categories = ["development-tools", "web-programming"]

[lib]
name = "execution_tool"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.40", features = ["rt", "process", "fs", "io-util", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "test-util"] }
